    <meta charset="utf-8">

    <meta http-equiv="Expires" content="0">
    <meta name="app-api-base" content="https://lppsp.ui.ac.id/scrt3/api">
    <title>Peta Padan Data KAT</title>
    <script>
      window.APP_VERSION = '20260608-shortlink-02';
      window.APP_CONFIG = window.APP_CONFIG || {};
      window.APP_CONFIG.apiBase = window.APP_CONFIG.apiBase || (/^(localhost|127\.0\.0\.1|::1)$/i.test(window.location.hostname) ? '../api' : 'https://lppsp.ui.ac.id/scrt3/api');
      window.APP_CONFIG.frontendBase = window.APP_CONFIG.frontendBase || 'https://dit-pskat.github.io';
      window.APP_CONFIG.shortlinkParam = window.APP_CONFIG.shortlinkParam || 's';
      window.APP_CONFIG.shortlinkPathPrefix = window.APP_CONFIG.shortlinkPathPrefix || 's';
    </script>
    <link rel="stylesheet" href="./assets/tailwind.generated.css?v=20260608-shortlink-02">
    <link rel="stylesheet" href="./assets/vendor/leaflet.css">
    <link rel="stylesheet" href="./assets/vendor/splitting.css">
    <link rel="stylesheet" href="./assets/vendor/splitting-cells.css">
    <link rel="stylesheet" href="./assets/app.css?v=20260608-shortlink-02">
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>window.react = window.React;</script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
    <script type="module">
      function shouldDisableHeroShader() {
        const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
        const coarse = window.matchMedia?.('(pointer: coarse)').matches;
        const small = window.matchMedia?.('(max-width: 760px)').matches;
        const lowPower = Number(navigator.hardwareConcurrency || 8) <= 4 || Number(navigator.deviceMemory || 8) <= 4;
        return reduce || coarse || small || lowPower || !navigator.gpu;
      }

      window.__KAT_DISABLE_SHADER = true;
      window.createKatHeroShader = async function createKatHeroShader() { return null; };

      async function installHeroShader() {
        if (window.__KAT_DISABLE_SHADER) return;
        const { createShader } = await import('https://cdn.jsdelivr.net/npm/shaders@latest/dist/js/bundle.js');
        window.createKatHeroShader = async function createKatHeroShader(canvas) {
          if (!canvas || shouldDisableHeroShader()) return null;
          const shader = await createShader(canvas, {
          components: [
            {
              id: 'kat_filmgrain',
              type: 'FilmGrain',
              props: { strength: 0.16, bias: 1.6, animated: false, opacity: 0.58, blendMode: 'screen' },
              children: [
                {
                  id: 'kat_chromaflow',
                  type: 'ChromaFlow',
                  props: {
                    baseColor: '#a8dcd3',
                    upColor: '#f3cf8a',
                    downColor: '#0f6f5a',
                    leftColor: '#4056a1',
                    rightColor: '#d59b35',
                    intensity: 0.92,
                    radius: 3.4,
                    momentum: 18,
                    opacity: 0.78,
                    blendMode: 'screen'
                  }
                }
              ]
            }
          ]
          }, { disableTelemetry: true });
          return shader;
        };
      }

      installHeroShader()
        .catch(error => console.debug?.('[shader] bundle fallback', error?.message || error))
        .finally(() => window.dispatchEvent(new Event('kat-shaders-ready')));
    </script>
    <script src="./assets/vendor/gsap.min.js"></script>
    <script src="./assets/vendor/splitting.min.js"></script>
    <script src="./assets/vendor/leaflet.js"></script>
    <script src="./assets/app.js?v=20260608-shortlink-02"></script>
  </body>
</html>
